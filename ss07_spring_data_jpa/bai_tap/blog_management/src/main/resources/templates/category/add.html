<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Create Category', ~{})}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar('category')}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Create Category</h2>
        <a th:href="@{/categories}" class="btn btn-secondary">Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/categories}" th:object="${category}" method="post" class="row g-3">
                <div class="col-12">
                    <label for="name" class="form-label">Name</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-success">Create</button>
                    <a th:href="@{/categories}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/layout :: scripts(~{})}"></th:block>
</body>
</html>
