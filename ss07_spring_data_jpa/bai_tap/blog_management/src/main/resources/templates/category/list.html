<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Category List', ~{})}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar('category')}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Category Management</h2>
        <a th:href="@{/categories/create}" class="btn btn-success">Add Category</a>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th style="width:120px">ID</th>
            <th>Name</th>
            <th style="width:220px">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <td>
                <a th:href="@{/categories/update/{id}(id=${category.id})}" class="btn btn-warning btn-sm">Edit</a>
                <form th:action="@{/categories/delete/{id}(id=${category.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this category?')">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="3" class="text-center text-muted">No categories found.</td>
        </tr>
        </tbody>
    </table>
</div>

<th:block th:replace="~{layout/layout :: scripts(~{})}"></th:block>
</body>
</html>
