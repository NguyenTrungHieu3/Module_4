<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: head('Blog List', ~{})}"></head>

<body>

<nav th:replace="~{layout/layout :: navbar('blog')}"></nav>

<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Blog Management</h2>
    <a th:href="@{/blogs/create}" class="btn btn-success">Create Blog</a>
  </div>

  <form th:action="@{/blogs}" method="get" class="row g-2 mb-3">
    <div class="col-md-5">
      <input type="text" name="searchTitle" th:value="${searchTitle}" class="form-control" placeholder="Search by title...">
    </div>
    <div class="col-md-4">
      <select name="searchCategoryId" class="form-select">
        <option value="">-- All categories --</option>
        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:selected="${searchCategoryId != null and category.id == searchCategoryId}"
                th:text="${category.name}"></option>
      </select>
    </div>
    <div class="col-md-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Filter</button>
      <a th:href="@{/blogs}" class="btn btn-outline-secondary">Reset</a>
    </div>
  </form>

  <table class="table table-bordered table-hover align-middle">

    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Image</th>
      <th>Title</th>
      <th>Author</th>
      <th>Category</th>
      <th>Created Date</th>
      <th style="width:220px">Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="blog : ${blogs}">

      <td th:text="${blog.id}"></td>

      <td>
        <img th:src="${blog.imageUrl}"
             style="width:80px;height:60px;object-fit:cover"
             class="rounded">
      </td>

      <td>
        <strong th:text="${blog.title}"></strong>
        <br>
        <small class="text-muted"
               th:text="${blog.summary}"></small>
      </td>

      <td th:text="${blog.author}"></td>

      <td>
                <span class="badge bg-primary"
                      th:text="${blog.category != null ? blog.category.name : ''}"></span>
      </td>

      <td th:text="${blog.createdAt != null ? #dates.format(blog.createdAt,'dd-MM-yyyy') : ''}"></td>

      <td>

        <a th:href="@{/blogs/{id}(id=${blog.id})}"
           class="btn btn-info btn-sm">
          View
        </a>

        <a th:href="@{/blogs/update/{id}(id=${blog.id})}"
           class="btn btn-warning btn-sm">
          Edit
        </a>

        <form th:action="@{/blogs/delete/{id}(id=${blog.id})}"
              method="post"
              style="display:inline;">

          <button type="submit"
                  class="btn btn-danger btn-sm"
                  onclick="return confirm('Delete this blog?')">
            Delete
          </button>

        </form>

      </td>

    </tr>

    <tr th:if="${blogs.isEmpty()}">
      <td colspan="7" class="text-center text-muted">No blogs found.</td>
    </tr>

    </tbody>

  </table>

</div>

<th:block th:replace="~{layout/layout :: scripts(~{})}"></th:block>

</body>
</html>
