<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Update Blog', ~{})}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar('blog')}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Update Blog</h2>
        <a th:href="@{/blogs}" class="btn btn-secondary">Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/blogs/update}" th:object="${blogDto}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label for="title" class="form-label">Title</label>
                    <input id="title" type="text" th:field="*{title}" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="author" class="form-label">Author</label>
                    <input id="author" type="text" th:field="*{author}" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="categoryId" class="form-label">Category</label>
                    <select id="categoryId" th:field="*{categoryId}" class="form-select" required>
                        <option value="" disabled>-- Select category --</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="imageUrl" class="form-label">Image URL</label>
                    <input id="imageUrl" type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://...">
                </div>

                <div class="col-12">
                    <label for="summary" class="form-label">Summary</label>
                    <textarea id="summary" th:field="*{summary}" class="form-control" rows="3"></textarea>
                </div>

                <div class="col-12">
                    <label for="content" class="form-label">Content</label>
                    <textarea id="content" th:field="*{content}" class="form-control" rows="8" required></textarea>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-warning">Update</button>
                    <a th:href="@{/blogs}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/layout :: scripts(~{})}"></th:block>
</body>
</html>
