<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Blog Detail', ~{})}"></head>
<body>
<nav th:replace="~{layout/layout :: navbar('blog')}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Blog Detail</h2>
        <div>
            <a th:href="@{/blogs/update/{id}(id=${blog.id})}" class="btn btn-warning">Edit</a>
            <a th:href="@{/blogs}" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="row g-4">
                <div class="col-md-4">
                    <img th:if="${blog.imageUrl != null and !#strings.isEmpty(blog.imageUrl)}"
                         th:src="${blog.imageUrl}"
                         alt="Blog image"
                         class="img-fluid rounded border"
                         style="max-height: 300px; object-fit: cover; width: 100%;">
                    <div th:if="${blog.imageUrl == null or #strings.isEmpty(blog.imageUrl)}"
                         class="border rounded d-flex align-items-center justify-content-center text-muted"
                         style="height: 220px;">
                        No image
                    </div>
                </div>

                <div class="col-md-8">
                    <h3 class="mb-2" th:text="${blog.title}">Title</h3>
                    <p class="text-muted mb-3" th:text="${blog.summary}">Summary</p>

                    <div class="mb-2"><strong>Author:</strong> <span th:text="${blog.author}"></span></div>
                    <div class="mb-2"><strong>Category:</strong> <span class="badge bg-primary" th:text="${blog.category}"></span></div>
                    <div class="mb-2"><strong>Created At:</strong> <span th:text="${blog.createdAt != null ? #dates.format(blog.createdAt,'dd-MM-yyyy HH:mm') : ''}"></span></div>
                    <div class="mb-3"><strong>Updated At:</strong> <span th:text="${blog.updatedAt != null ? #dates.format(blog.updatedAt,'dd-MM-yyyy HH:mm') : ''}"></span></div>

                    <hr>
                    <h5>Content</h5>
                    <p class="mb-0" style="white-space: pre-line;" th:text="${blog.content}"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/layout :: scripts(~{})}"></th:block>
</body>
</html>
