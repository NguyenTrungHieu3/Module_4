<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: head('Blog List', ~{})}"></head>

<body>

<nav th:replace="~{layout/layout :: navbar('blog')}"></nav>

<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Blog Management</h2>
    <a th:href="@{/blogs/create}" class="btn btn-success">Create Blog</a>
  </div>

  <form id="searchForm" class="row g-2 mb-3">
    <div class="col-md-5">
      <label for="searchTitle" class="form-label visually-hidden">Search title</label>
      <input id="searchTitle" type="text" name="searchTitle" class="form-control" placeholder="Search by title...">
    </div>
    <div class="col-md-4">
      <label for="searchCategoryId" class="form-label visually-hidden">Search category</label>
      <select id="searchCategoryId" name="searchCategoryId" class="form-select">
        <option value="">-- All categories --</option>
        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:text="${category.name}"></option>
      </select>
    </div>
    <div class="col-md-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Search</button>
      <button id="resetBtn" type="button" class="btn btn-outline-secondary">Reset</button>
    </div>
  </form>

  <table class="table table-bordered table-hover align-middle">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Image</th>
      <th>Title</th>
      <th>Author</th>
      <th>Category</th>
      <th>Created Date</th>
      <th style="width:220px">Actions</th>
    </tr>
    </thead>
    <tbody id="blogTableBody"></tbody>
  </table>

  <div id="emptyState" class="text-center text-muted my-3 d-none">No blogs found.</div>

  <div class="d-flex justify-content-center mb-3">
    <button id="loadMoreBtn" type="button" class="btn btn-outline-primary">Load more</button>
  </div>
</div>

<th:block th:replace="~{layout/layout :: scripts(~{::extraJs})}"></th:block>
<th:block th:fragment="extraJs">
  <script th:src="@{/js/blog-list.js}"></script>
</th:block>

</body>
</html>
